<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivero Sol y Sombra — Sistema POS e Inventario</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-stone-100 text-stone-800 font-sans min-h-screen">

    <!-- Header / Encabezado -->
    <header class="bg-emerald-900 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <img src="/logo.png" alt="Logo" class="h-10 w-10 rounded-full bg-white p-1 object-contain" onerror="this.style.display='none'">
                <div>
                    <h1 class="text-xl font-bold">Agro Servicio Sol y Sombra</h1>
                    <p class="text-xs text-emerald-200">POS & Control de Inventario</p>
                </div>
            </div>
            <a href="/catalogo.html" target="_blank" class="bg-emerald-700 hover:bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition flex items-center gap-2">
                <i class="fas fa-store"></i> Ver Catálogo Web
            </a>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6">
        <!-- Métricas Rápidas -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-stone-200 text-center">
                <p class="text-xs font-bold text-stone-500 uppercase tracking-wider">Especies Distintas</p>
                <p id="totalEspecies" class="text-3xl font-extrabold text-emerald-900">0</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-stone-200 text-center">
                <p class="text-xs font-bold text-stone-500 uppercase tracking-wider">Total Plantas en Stock</p>
                <p id="totalStock" class="text-3xl font-extrabold text-emerald-900">0</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-stone-200 text-center">
                <p class="text-xs font-bold text-stone-500 uppercase tracking-wider">Valor Total Inventario</p>
                <p id="valorInventario" class="text-3xl font-extrabold text-emerald-900">$0</p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <!-- Formulario de Registro (Izquierda) -->
            <div class="lg:col-span-4 bg-white p-5 rounded-xl shadow-sm border border-stone-200">
                <h2 class="text-lg font-bold text-emerald-900 mb-4 border-b pb-2">Registrar Planta</h2>
                <form id="plantaForm" onsubmit="guardarPlanta(event)" class="space-y-3">
                    <div>
                        <label class="block text-xs font-semibold text-stone-700 mb-1">Nombre común *</label>
                        <input type="text" id="nombre" required placeholder="Ej: Níspero" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-stone-700 mb-1">Nombre científico</label>
                        <input type="text" id="cientifico" placeholder="Ej: Eriobotrya japonica" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-semibold text-stone-700 mb-1">Categoría</label>
                            <input type="text" id="categoria" placeholder="Ej: Frutal" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-stone-700 mb-1">Ubicación física</label>
                            <input type="text" id="ubicacion" placeholder="Ej: Nave sombra" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-semibold text-stone-700 mb-1">Precio ($) *</label>
                            <input type="number" id="precio" required min="0" placeholder="5000" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-stone-700 mb-1">Stock inicial *</label>
                            <input type="number" id="stock" required min="0" placeholder="10" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                        </div>
                    </div>
                    
                    <!-- CAMPO DE FOTO CON CÁMARA PARA CELULAR -->
                    <div>
                        <label class="block text-xs font-semibold text-stone-700 mb-1">Foto (Tomar con Cámara / Subir):</label>
                        <input type="file" id="fotoInput" accept="image/*" capture="environment" class="w-full text-xs text-stone-500 file:mr-2 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-emerald-100 file:text-emerald-800 hover:file:bg-emerald-200">
                    </div>

                    <button type="submit" class="w-full bg-emerald-800 hover:bg-emerald-900 text-white font-bold py-2.5 rounded-lg text-sm transition mt-4">
                        Agregar Planta
                    </button>
                </form>
            </div>

            <!-- Tabla de Inventario (Centro) -->
            <div class="lg:col-span-8 bg-white p-5 rounded-xl shadow-sm border border-stone-200 overflow-x-auto">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-emerald-900">Inventario Disponible</h2>
                    <input type="text" id="buscarInput" onkeyup="buscarPlanta()" placeholder="Buscar planta..." class="border rounded-lg px-3 py-1.5 text-sm w-48 sm:w-64 focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>

                <table class="w-full text-left text-sm">
                    <thead>
                        <tr class="bg-emerald-900 text-white text-xs uppercase">
                            <th class="p-2.5 rounded-l-lg">Foto</th>
                            <th class="p-2.5">Nombre</th>
                            <th class="p-2.5">Precio</th>
                            <th class="p-2.5">Stock</th>
                            <th class="p-2.5 rounded-r-lg text-center">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="inventarioTabla" class="divide-y divide-stone-100">
                        <tr>
                            <td colspan="5" class="text-center py-6 text-stone-400">Cargando datos...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        let inventario = [];

        async function cargarInventario() {
            try {
                const res = await fetch('/api/plantas');
                inventario = await res.json();
                renderTabla(inventario);
                actualizarMetricas();
            } catch (err) {
                console.error("Error al cargar inventario:", err);
            }
        }

        function renderTabla(lista) {
            const tbody = document.getElementById('inventarioTabla');
            tbody.innerHTML = '';

            if (lista.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center py-6 text-stone-400">No hay plantas en inventario</td></tr>';
                return;
            }

            lista.forEach(p => {
                const fotoRuta = p.foto || p.imagen || p.imagenUrl || '/logo.png';
                const tr = document.createElement('tr');
                tr.className = "hover:bg-stone-50 transition";
                tr.innerHTML = `
                    <td class="p-2"><img src="${fotoRuta}" class="w-10 h-10 object-cover rounded-lg" onerror="this.src='/logo.png'"></td>
                    <td class="p-2 font-semibold text-stone-800">${p.nombre}</td>
                    <td class="p-2 text-emerald-800 font-bold">$${Number(p.precio).toLocaleString('es-CL')}</td>
                    <td class="p-2">${p.stock}</td>
                    <td class="p-2 text-center">
                        <button onclick="eliminarPlanta('${p._id || p.id}')" class="text-rose-600 hover:text-rose-800 p-1"><i class="fas fa-trash"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function actualizarMetricas() {
            document.getElementById('totalEspecies').innerText = inventario.length;
            const totalStock = inventario.reduce((acc, p) => acc + Number(p.stock || 0), 0);
            const valorTotal = inventario.reduce((acc, p) => acc + (Number(p.precio || 0) * Number(p.stock || 0)), 0);
            document.getElementById('totalStock').innerText = totalStock;
            document.getElementById('valorInventario').innerText = '$' + valorTotal.toLocaleString('es-CL');
        }

        async function guardarPlanta(e) {
            e.preventDefault();
            const formData = new FormData();
            formData.append('nombre', document.getElementById('nombre').value);
            formData.append('cientifico', document.getElementById('cientifico').value);
            formData.append('categoria', document.getElementById('categoria').value);
            formData.append('ubicacion', document.getElementById('ubicacion').value);
            formData.append('precio', document.getElementById('precio').value);
            formData.append('stock', document.getElementById('stock').value);

            const fotoInput = document.getElementById('fotoInput');
            if (fotoInput.files[0]) {
                formData.append('foto', fotoInput.files[0]);
            }

            try {
                await fetch('/api/plantas', { method: 'POST', body: formData });
                document.getElementById('plantaForm').reset();
                cargarInventario();
            } catch (err) {
                alert("Error al guardar la planta");
            }
        }

        function buscarPlanta() {
            const query = document.getElementById('buscarInput').value.toLowerCase();
            const filtradas = inventario.filter(p => p.nombre.toLowerCase().includes(query));
            renderTabla(filtradas);
        }

        cargarInventario();
    </script>
</body>
</html>
