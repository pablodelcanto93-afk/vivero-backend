<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Vivero Sol y Sombra</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #f4f7f6; color: #333; }
        header { background: #1b5e20; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .logo-head { width: 45px; height: 45px; border-radius: 50%; vertical-align: middle; margin-right: 10px; }
        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
        .actions-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-primary { background: #2e7d32; color: white; border: none; padding: 10px 18px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-primary:hover { background: #1b5e20; }
        
        table { width: 100%; background: white; border-collapse: collapse; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #e8f5e9; color: #2e7d32; }
        .img-thumb { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; }

        /* Modal */
        .modal-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 100; }
        .modal { background: white; padding: 25px; border-radius: 10px; width: 100%; max-width: 500px; position: relative; }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 1.5em; cursor: pointer; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 15px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group.full { grid-column: 1 / -1; }
        label { font-size: 0.85em; font-weight: bold; margin-bottom: 4px; color: #555; }
        input { padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95em; }
        .btn-danger { background: #c62828; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <div>
        <img src="/logo.png" class="logo-head" onerror="this.style.display='none'">
        <span style="font-size: 1.2em; font-weight: bold;">Vivero Sol y Sombra</span>
    </div>
    <a href="/catalogo.html" target="_blank" style="color: white; text-decoration: none; font-weight: bold;">🌐 Ver Catálogo</a>
</header>

<div class="container">
    <div class="actions-bar">
        <h2>Gestión de Inventario</h2>
        <button class="btn-primary" onclick="abrirModal()">+ Agregar Planta</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Foto</th>
                <th>Nombre</th>
                <th>Categoría</th>
                <th>Precio</th>
                <th>Stock</th>
                <th>Ubicación</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="tablaPlantas"></tbody>
    </table>
</div>

<!-- Modal Agregar Planta -->
<div class="modal-bg" id="modalPlanta">
    <div class="modal">
        <span class="close-btn" onclick="cerrarModal()">&times;</span>
        <h3>Agregar Nueva Planta</h3>
        <form id="formPlanta" enctype="multipart/form-data">
            <div class="form-grid">
                <div class="form-group">
                    <label>Nombre Común *</label>
                    <input type="text" name="nombre" required>
                </div>
                <div class="form-group">
                    <label>Nombre Científico</label>
                    <input type="text" name="cientifico">
                </div>
                <div class="form-group">
                    <label>Categoría</label>
                    <input type="text" name="categoria" placeholder="Frutal, Cítrico...">
                </div>
                <div class="form-group">
                    <label>Precio ($) *</label>
                    <input type="number" name="precio" required min="0">
                </div>
                <div class="form-group">
                    <label>Stock *</label>
                    <input type="number" name="stock" required min="0">
                </div>
                <div class="form-group">
                    <label>Ubicación</label>
                    <input type="text" name="ubicacion" placeholder="Ej: n1">
                </div>
                <div class="form-group full">
                    <label>Foto de la Planta</label>
                    <input type="file" name="foto" accept="image/*">
                </div>
            </div>
            <button type="submit" class="btn-primary" style="width: 100%; margin-top: 18px;" id="btnGuardar">Guardar Planta</button>
        </form>
    </div>
</div>

<script>
    async function cargarTabla() {
        try {
            const res = await fetch('/api/plantas');
            const plantas = await res.json();
            const tbody = document.getElementById('tablaPlantas');
            
            tbody.innerHTML = plantas.map(p => `
                <tr>
                    <td><img src="${p.foto}" class="img-thumb" onerror="this.src='/logo.png'"></td>
                    <td><b>${p.nombre}</b><br><small><i>${p.cientifico || ''}</i></small></td>
                    <td>${p.categoria || '-'}</td>
                    <td>$${Number(p.precio).toLocaleString('es-CL')}</td>
                    <td>${p.stock} u.</td>
                    <td>${p.ubicacion || '-'}</td>
                    <td><button class="btn-danger" onclick="eliminarPlanta(${p.id})">Eliminar</button></td>
                </tr>
            `).join('');
        } catch(e) {
            console.error("Error al cargar la tabla", e);
        }
    }

    document.getElementById('formPlanta').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btnGuardar');
        btn.disabled = true;
        btn.innerText = 'Guardando...';

        const formData = new FormData(e.target);

        try {
            const res = await fetch('/api/plantas', {
                method: 'POST',
                body: formData
            });
            const data = await res.json();
            
            if (data.success) {
                cerrarModal();
                e.target.reset();
                cargarTabla();
            } else {
                alert('Error al guardar: ' + data.message);
            }
        } catch (err) {
            alert('Error de conexión con el servidor');
        } finally {
            btn.disabled = false;
            btn.innerText = 'Guardar Planta';
        }
    });

    async function eliminarPlanta(id) {
        if (!confirm('¿Eliminar esta planta?')) return;
        await fetch(`/api/plantas/${id}`, { method: 'DELETE' });
        cargarTabla();
    }

    function abrirModal() { document.getElementById('modalPlanta').style.display = 'flex'; }
    function cerrarModal() { document.getElementById('modalPlanta').style.display = 'none'; }

    cargarTabla();
</script>
</body>
</html>
