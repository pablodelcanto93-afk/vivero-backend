<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivero Sol y Sombra — System</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f8; color: #333; }
        
        /* Pantalla de bloqueo / PIN */
        #lock-screen {
            display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #1b382b;
        }
        .pin-card {
            background: white; padding: 30px; border-radius: 12px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.2); max-width: 350px; width: 90%;
        }
        .pin-card img { width: 100px; margin-bottom: 15px; }
        .pin-card input {
            width: 100%; padding: 12px; font-size: 18px; text-align: center; border: 2px solid #ccc; border-radius: 8px; margin: 15px 0; letter-spacing: 4px;
        }
        
        /* Dashboard Principal */
        #app-content { padding: 20px; max-width: 1200px; margin: 0 auto; }
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .metric-card { background: white; padding: 15px; border-radius: 8px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .metric-card h3 { font-size: 12px; color: #666; text-transform: uppercase; margin-bottom: 5px; }
        .metric-card .val { font-size: 24px; font-weight: bold; color: #1b382b; }
        
        /* Formulario y Tablas */
        .main-layout { display: grid; grid-template-columns: 320px 1fr 300px; gap: 20px; }
        @media (max-width: 900px) { .main-layout { grid-template-columns: 1fr; } }
        
        .box { background: white; padding: 18px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 4px; color: #555; }
        .form-group input, .form-group select { width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        
        .btn { border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.2s; }
        .btn-green { background: #2e7d32; color: white; }
        .btn-green:hover { background: #1b5e20; }
        .btn-cancel { background: #757575; color: white; }
        
        /* Tabla */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #eee; font-size: 13px; }
        th { background: #1b382b; color: white; }
        .img-thumb { width: 45px; height: 45px; object-fit: cover; border-radius: 4px; background: #eee; }
    </style>
</head>
<body>

    <!-- PANTALLA DE LOGIN -->
    <div id="lock-screen">
        <div class="pin-card">
            <img src="/logo.png" alt="Sol y Sombra" onerror="this.style.display='none'">
            <h2>Sol y Sombra</h2>
            <p style="font-size: 12px; color: #666; margin-top: 5px;">Ingresa la clave para acceder</p>
            <input type="password" id="pin-input" placeholder="••••" maxlength="10">
            <button class="btn btn-green" onclick="validarPin()">Entrar al Sistema</button>
        </div>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <div id="app-content" style="display: none;">
        <!-- METRICAS -->
        <div class="metrics-grid">
            <div class="metric-card">
                <h3>Especies Distintas</h3>
                <div class="val" id="metric-especies">0</div>
            </div>
            <div class="metric-card">
                <h3>Total Plantas en Stock</h3>
                <div class="val" id="metric-stock">0</div>
            </div>
            <div class="metric-card">
                <h3>Valor Total Inventario</h3>
                <div class="val" id="metric-valor">$0</div>
            </div>
        </div>

        <div class="main-layout">
            <!-- FORMULARIO REGISTRAR PLANTA -->
            <div class="box">
                <h3 style="margin-bottom: 15px; color: #1b382b;">Registrar Planta</h3>
                <form id="form-planta">
                    <div class="form-group">
                        <label>Nombre común *</label>
                        <input type="text" id="nombre" required placeholder="Ej: Níspero">
                    </div>
                    <div class="form-group">
                        <label>Nombre científico</label>
                        <input type="text" id="cientifico" placeholder="Ej: Eriobotrya japonica">
                    </div>
                    <div class="form-group">
                        <label>Categoría</label>
                        <input type="text" id="categoria" placeholder="Ej: Frutal, Interior">
                    </div>
                    <div class="form-group">
                        <label>Ubicación física</label>
                        <input type="text" id="ubicacion" placeholder="Ej: Nave sombra">
                    </div>
                    <div class="form-group">
                        <label>Precio ($) *</label>
                        <input type="number" id="precio" required placeholder="5000">
                    </div>
                    <div class="form-group">
                        <label>Stock inicial *</label>
                        <input type="number" id="stock" required placeholder="10">
                    </div>

                    <!-- CAMARA INCORPORADA -->
                    <div class="form-group">
                        <label>📸 Foto de la Planta:</label>
                        
                        <!-- Visor de la Cámara -->
                        <div id="camera-container" style="display: none; border: 2px solid #ccc; border-radius: 8px; overflow: hidden; margin-bottom: 10px; background: black; text-align: center;">
                            <video id="video-feed" autoplay playsinline style="width: 100%; max-height: 250px; object-fit: cover;"></video>
                            <div style="padding: 8px; background: #222;">
                                <button type="button" id="btn-capture" class="btn btn-green" style="margin-bottom: 5px;">📸 Capturar Foto</button>
                                <button type="button" id="btn-cancel-cam" class="btn btn-cancel">❌ Cancelar</button>
                            </div>
                        </div>

                        <!-- Vista Previa de la Foto Tomada -->
                        <div id="photo-preview-container" style="display: none; text-align: center; margin-bottom: 10px;">
                            <img id="photo-preview" src="" style="max-width: 100%; max-height: 150px; border-radius: 6px; border: 1px solid #ccc;">
                            <button type="button" id="btn-retake" class="btn btn-cancel" style="margin-top: 5px; font-size: 11px;">🔄 Tomar otra foto</button>
                        </div>

                        <!-- Botón para Encender Cámara -->
                        <button type="button" id="btn-start-camera" class="btn btn-green" style="background-color: #27ae60;">📷 Activar Cámara Ahora</button>
                        
                        <input type="hidden" id="foto-base64">
                        <canvas id="photo-canvas" style="display: none;"></canvas>
                    </div>

                    <button type="submit" class="btn btn-green" style="margin-top: 10px;">Agregar Planta</button>
                </form>
            </div>

            <!-- TABLA INVENTARIO -->
            <div class="box" style="grid-column: span 2;">
                <h3 style="margin-bottom: 10px; color: #1b382b;">Inventario</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Foto</th>
                            <th>Nombre</th>
                            <th>Precio</th>
                            <th>Stock</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-plantas">
                        <tr><td colspan="5" style="text-align:center;">No hay plantas registradas.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // --- VALIDAR PIN ---
        async function validarPin() {
            const pin = document.getElementById('pin-input').value;
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pin })
            });

            if (res.ok) {
                document.getElementById('lock-screen').style.display = 'none';
                document.getElementById('app-content').style.display = 'block';
                cargarInventario();
            } else {
                alert('🔒 Clave incorrecta.');
            }
        }

        // --- CÁMARA EN VIVO ---
        const btnStartCamera = document.getElementById('btn-start-camera');
        const cameraContainer = document.getElementById('camera-container');
        const videoFeed = document.getElementById('video-feed');
        const btnCapture = document.getElementById('btn-capture');
        const btnCancelCam = document.getElementById('btn-cancel-cam');
        const photoPreviewContainer = document.getElementById('photo-preview-container');
        const photoPreview = document.getElementById('photo-preview');
        const btnRetake = document.getElementById('btn-retake');
        const fotoBase64Input = document.getElementById('foto-base64');
        const photoCanvas = document.getElementById('photo-canvas');
        let stream = null;

        btnStartCamera.addEventListener('click', async () => {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' }, audio: false
                });
                videoFeed.srcObject = stream;
                cameraContainer.style.display = 'block';
                btnStartCamera.style.display = 'none';
                photoPreviewContainer.style.display = 'none';
            } catch (err) {
                alert('No se pudo acceder a la cámara. Asegúrate de otorgar los permisos en el navegador.');
            }
        });

        function apagarCamara() {
            if (stream) { stream.getTracks().forEach(track => track.stop()); stream = null; }
            cameraContainer.style.display = 'none';
        }

        btnCancelCam.addEventListener('click', () => {
            apagarCamara();
            btnStartCamera.style.display = 'block';
        });

        btnCapture.addEventListener('click', () => {
            if (!stream) return;
            photoCanvas.width = videoFeed.videoWidth;
            photoCanvas.height = videoFeed.videoHeight;
            const context = photoCanvas.getContext('2d');
            context.drawImage(videoFeed, 0, 0, photoCanvas.width, photoCanvas.height);
            
            const imageData = photoCanvas.toDataURL('image/jpeg', 0.7);
            fotoBase64Input.value = imageData;
            photoPreview.src = imageData;
            
            apagarCamara();
            photoPreviewContainer.style.display = 'block';
        });

        btnRetake.addEventListener('click', () => {
            fotoBase64Input.value = "";
            btnStartCamera.click();
        });

        // --- INVENTARIO Y API ---
        async function cargarInventario() {
            const res = await fetch('/api/plantas');
            const plantas = await res.json();
            
            let html = '';
            let totalStock = 0;
            let valorTotal = 0;

            plantas.forEach(p => {
                totalStock += parseInt(p.stock || 0);
                valorTotal += parseInt(p.precio || 0) * parseInt(p.stock || 0);

                html += `
                    <tr>
                        <td><img src="${p.foto || '/logo.png'}" class="img-thumb" onerror="this.src='/logo.png'"></td>
                        <td><strong>${p.nombre}</strong><br><small style="color:#666">${p.cientifico || ''}</small></td>
                        <td>$${parseInt(p.precio).toLocaleString('es-CL')}</td>
                        <td>${p.stock}</td>
                        <td><button onclick="eliminarPlanta('${p.id}')" style="background:#e74c3c; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">🗑️</button></td>
                    </tr>
                `;
            });

            document.getElementById('tabla-plantas').innerHTML = html || '<tr><td colspan="5" style="text-align:center;">No hay plantas enviadas.</td></tr>';
            document.getElementById('metric-especies').innerText = plantas.length;
            document.getElementById('metric-stock').innerText = totalStock;
            document.getElementById('metric-valor').innerText = '$' + valorTotal.toLocaleString('es-CL');
        }

        document.getElementById('form-planta').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const nuevaPlanta = {
                nombre: document.getElementById('nombre').value,
                cientifico: document.getElementById('cientifico').value,
                categoria: document.getElementById('categoria').value,
                ubicacion: document.getElementById('ubicacion').value,
                precio: document.getElementById('precio').value,
                stock: document.getElementById('stock').value,
                foto: document.getElementById('foto-base64').value
            };

            await fetch('/api/plantas', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(nuevaPlanta)
            });

            // Limpiar formulario
            document.getElementById('form-planta').reset();
            document.getElementById('foto-base64').value = "";
            document.getElementById('photo-preview-container').style.display = 'none';
            btnStartCamera.style.display = 'block';

            cargarInventario();
        });

        async function eliminarPlanta(id) {
            if (confirm('¿Eliminar esta planta?')) {
                await fetch(`/api/plantas/${id}`, { method: 'DELETE' });
                cargarInventario();
            }
        }
    </script>
</body>
</html>
