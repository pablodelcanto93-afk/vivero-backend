<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Vivero Sol y Sombra</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #f3f6f4; color: #2d3748; padding-bottom: 50px; }
        
        .header {
            background: linear-gradient(135deg, #1b5e20, #2e7d32);
            color: white;
            padding: 30px 15px;
            text-align: center;
        }

        .header-title {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .logo { width: 60px; height: 60px; border-radius: 50%; border: 2px solid white; background: white; }

        .info-box {
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            padding: 12px;
            max-width: 650px;
            margin: 0 auto;
            font-size: 0.9em;
            line-height: 1.5;
            text-align: left;
        }

        .info-box a { color: #81c784; font-weight: bold; }

        .search-box {
            max-width: 900px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 18px;
            border: 2px solid #a5d6a7;
            border-radius: 25px;
            font-size: 1em;
            outline: none;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            max-width: 900px;
            margin: 0 auto;
            padding: 0 15px;
        }

        .card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: #e0e0e0;
        }

        .card-body {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .tag {
            align-self: flex-start;
            background: #e8f5e9;
            color: #2e7d32;
            font-size: 0.75em;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 12px;
            margin-bottom: 8px;
        }

        .title { font-size: 1.1em; font-weight: bold; color: #1b5e20; }
        .sub { font-size: 0.85em; color: #666; font-style: italic; margin-bottom: 8px; }
        .price { font-size: 1.25em; font-weight: bold; color: #111; margin-bottom: 12px; }

        .btn-wsp {
            background: #25d366;
            color: white;
            text-decoration: none;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            margin-top: auto;
            display: block;
        }

        .btn-wsp:hover { background: #128c7e; }
        .empty { grid-column: 1 / -1; text-align: center; color: #777; padding: 40px; }
    </style>
</head>
<body>

<div class="header">
    <div class="header-title">
        <img src="/logo.png" class="logo" onerror="this.style.display='none'">
        <h1>Vivero Sol y Sombra</h1>
    </div>
    <div class="info-box">
        📍 <b>Ubicación:</b> Camino Internacional, Sector La Victoria, Limache. 
        <a href="https://www.google.com/maps/place/AgroServicio+Sol+y+Sombra/@-32.9246823,-71.4244564,17z" target="_blank">Ver Mapa 🗺️</a><br>
        🎯 <b>Atención presencial:</b> Previo aviso.<br>
        🚚 <b>Reparto a domicilio:</b> Sábados.<br>
        📞 <b>Contacto:</b> +56 9 5345 0809
    </div>
</div>

<div class="search-box">
    <input type="text" id="buscar" placeholder="🔍 Buscar por planta o categoría..." onkeyup="filtrar()">
</div>

<div class="grid" id="grid"></div>

<script>
    let lista = [];

    async function cargar() {
        try {
            const res = await fetch('/api/plantas');
            lista = await res.json();
            dibujar(lista);
        } catch (e) {
            document.getElementById('grid').innerHTML = '<p class="empty">Error al cargar plantas.</p>';
        }
    }

    function dibujar(datos) {
        const grid = document.getElementById('grid');
        const disponibles = datos.filter(p => Number(p.stock) > 0);

        if (disponibles.length === 0) {
            grid.innerHTML = '<p class="empty">No hay plantas disponibles en este momento.</p>';
            return;
        }

        grid.innerHTML = disponibles.map(p => {
            const precio = Number(p.precio).toLocaleString('es-CL');
            const msg = encodeURIComponent(`Hola, me interesa consultar por la planta ${p.nombre} ($${precio}) vista en el catálogo.`);
            return `
                <div class="card">
                    <img src="${p.foto}" onerror="this.src='/logo.png'">
                    <div class="card-body">
                        ${p.categoria ? `<span class="tag">${p.categoria}</span>` : ''}
                        <div class="title">${p.nombre}</div>
                        <div class="sub">${p.cientifico || ''}</div>
                        <div class="price">$${precio}</div>
                        <a href="https://wa.me/56953450809?text=${msg}" target="_blank" class="btn-wsp">💬 Consultar por WhatsApp</a>
                    </div>
                </div>
            `;
        }).join('');
    }

    function filtrar() {
        const q = document.getElementById('buscar').value.toLowerCase();
        const res = lista.filter(p => 
            p.nombre.toLowerCase().includes(q) || 
            (p.categoria && p.categoria.toLowerCase().includes(q))
        );
        dibujar(res);
    }

    cargar();
</script>

</body>
</html>
