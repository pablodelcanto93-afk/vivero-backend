<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Vivero Sol y Sombra</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background: #f9f9f9; padding: 20px; }
        h1 { text-align: center; color: #2e7d32; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; padding-bottom: 15px; }
        .card img { width: 100%; height: 180px; object-fit: cover; }
        .card h3 { margin: 10px 0 5px; color: #333; }
        .card p { color: #666; font-size: 0.9em; margin-bottom: 10px; }
        .price { font-size: 1.2em; color: #2e7d32; font-weight: bold; }
    </style>
</head>
<body>

<h1>Nuestras Plantas - Vivero Sol y Sombra</h1>
<div class="grid" id="catalogoGrid"></div>

<script>
    async function cargarCatalogo() {
        const res = await fetch('/api/plantas/publico');
        const plantas = await res.json();
        const grid = document.getElementById('catalogoGrid');
        grid.innerHTML = '';
        plantas.forEach(p => {
            grid.innerHTML += `
                <div class="card">
                    <img src="${p.foto || '/logo.png'}">
                    <h3>${p.nombre}</h3>
                    <p><i>${p.cientifico || ''}</i></p>
                    <div class="price">$${p.precio}</div>
                </div>
            `;
        });
    }
    cargarCatalogo();
</script>
</body>
</html>
