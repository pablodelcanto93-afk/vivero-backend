<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Vivero Sol y Sombra</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZCZNTEPHH5"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-ZCZNTEPHH5');
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background: #ebe4d8; color: #3f443b; padding-bottom: 50px; }
        
        .header {
            background: #2D4A22;
            color: #ffffff;
            padding: 34px 15px;
            text-align: center;
            box-shadow: 0 3px 12px rgba(53, 41, 28, 0.2);
        }

        .header-title {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .header-title h1 { color: #FDFBF7; }

        .logo { width: 72px; height: 72px; border-radius: 50%; border: 2px solid white; background: white; }

        .info-box {
            background: #f5efe6;
            border: 1px solid #d1c7bd;
            border-radius: 12px;
            color: #4a4a3d;
            padding: 14px 16px;
            max-width: 650px;
            margin: 0 auto;
            font-size: 0.9em;
            line-height: 1.5;
            text-align: left;
        }

        .info-box a { color: #2d4a22; font-weight: bold; }

        .search-box {
            max-width: 940px;
            margin: 24px auto 18px;
            padding: 0 15px;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 220px;
            gap: 12px;
        }

        .search-box input, .search-box select {
            width: 100%;
            padding: 13px 16px;
            border: 1px solid #c7b9a5;
            border-radius: 8px;
            font-size: 1em;
            outline: none;
            background: #fdfbf7;
            color: #2d4a22;
        }

        .search-box input:focus, .search-box select:focus {
            border-color: #617746;
            box-shadow: 0 0 0 3px rgba(97, 119, 70, 0.15);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            max-width: 940px;
            margin: 0 auto;
            padding: 0 15px;
        }

        .card {
            background: #ffffff;
            border: 1px solid #d8cec1;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 22px rgba(30, 80, 40, 0.09);
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 28px rgba(30, 80, 40, 0.15);
        }

        .card-image-wrap {
            padding: 4px;
            border: 1px solid #e0dad1;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.06);
        }

        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
            background: #e0e0e0;
            display: block;
            cursor: pointer;
            transition: transform 0.35s ease;
        }

        .card:hover img { transform: scale(1.06); }

        .stock-badge {
            display: inline-flex;
            align-items: center;
            align-self: flex-start;
            border-radius: 999px;
            font-size: 0.75em;
            font-weight: bold;
            padding: 4px 9px;
            margin-bottom: 9px;
        }

        .stock-badge.in-stock { background: #dcfce7; color: #166534; }
        .stock-badge.out-of-stock { background: #e5e7eb; color: #4b5563; }

        .card-body {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .tag {
            align-self: flex-start;
            background: #e8f5e9;
            color: #2e7d32;
            font-size: 0.75em;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 12px;
            margin-bottom: 8px;
        }

        .title { font-size: 1.1em; font-weight: bold; color: #2d4a22; cursor: pointer; }
        .sub { font-size: 0.85em; color: #666; font-style: italic; margin-bottom: 8px; }
        .price { font-size: 1.25em; font-weight: bold; color: #c85a32; margin-bottom: 12px; }

        .btn-wsp {
            background: #697b45;
            color: white;
            text-decoration: none;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            margin-top: auto;
            display: block;
        }

        .btn-wsp:hover { background: #4f6132; }
        .empty { grid-column: 1 / -1; text-align: center; color: #777; padding: 40px; }

        .modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 10;
            background: rgba(15, 35, 20, 0.58);
            padding: 20px;
            align-items: center;
            justify-content: center;
        }

        .modal-backdrop.visible { display: flex; }

        .modal {
            position: relative;
            width: min(520px, 100%);
            max-height: 90vh;
            overflow-y: auto;
            background: #fdfbf7;
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
        }

        .modal h2 { color: #1b5e20; margin-bottom: 5px; }
        .modal-scientific { color: #64748b; font-style: italic; margin-bottom: 20px; }
        .modal dl { display: grid; gap: 13px; }
        .modal dt { color: #256b32; font-size: 0.78em; font-weight: bold; text-transform: uppercase; }
        .modal dd { line-height: 1.5; margin-top: 3px; }

        .modal-close {
            position: absolute;
            top: 10px;
            right: 13px;
            border: 0;
            background: transparent;
            color: #64748b;
            cursor: pointer;
            font-size: 1.8em;
            line-height: 1;
        }

        @media (max-width: 520px) {
            .header { padding: 24px 12px; }
            .header-title h1 { font-size: 1.55em; }
            .search-box { grid-template-columns: 1fr; }
            .modal { padding: 24px 20px; }
        }
    </style>
</head>
<body>

<div class="header">
    <div class="header-title">
        <img src="/logo.png" class="logo" onerror="this.style.display='none'">
        <h1>Vivero Sol y Sombra</h1>
    </div>
    <div class="info-box">
        📍 <b>Ubicación:</b> Camino Internacional, Sector La Victoria, Limache. 
        <a href="https://www.google.com/maps/place/AgroServicio+Sol+y+Sombra/@-32.9246778,-71.4270313,17z/data=!3m1!4b1!4m6!3m5!1s0x9689db0044ae9183:0xcb56b7e29284535d!8m2!3d-32.9246823!4d-71.4244564!16s%2Fg%2F11w3v1r78p" target="_blank" style="color: #2D4A22; font-weight: bold; text-decoration: underline;">Ver Mapa 🗺️</a><br>
        🎯 <b>Atención presencial:</b> Previo aviso.<br>
        🚚 <b>Reparto a domicilio:</b> Sábados.<br>
        📞 <b>Contacto:</b> +56 9 5345 0809
    </div>
</div>

<div class="search-box">
    <input type="text" id="buscar" placeholder="🔍 Buscar por planta o categoría..." onkeyup="filtrar()">
    <select id="filtroCategoria" aria-label="Filtrar por categoría" onchange="seleccionarCategoria(this.value)">
        <option value="Todas">Todas las categorías</option>
    </select>
</div>

<div class="grid" id="grid"></div>

<div class="modal-backdrop" id="modalPlanta" onclick="cerrarModal(event)">
    <article class="modal" role="dialog" aria-modal="true" aria-labelledby="modalNombre">
        <button class="modal-close" type="button" aria-label="Cerrar ficha" onclick="cerrarModal()">&times;</button>
        <h2 id="modalNombre"></h2>
        <p class="modal-scientific" id="modalCientifico"></p>
        <dl>
            <div><dt>💧 Riego</dt><dd id="modalRiego"></dd></div>
            <div><dt>☀️ Clima</dt><dd id="modalClima"></dd></div>
            <div><dt>🌱 Consejos de cuidado</dt><dd id="modalCuidados"></dd></div>
        </dl>
    </article>
</div>

<script>
    let lista = [];
    let categoriaActiva = 'Todas';

    function escaparHtml(valor) {
        return String(valor ?? '').replace(/[&<>'"]/g, caracter => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
        }[caracter]));
    }

    async function cargar() {
        try {
            const res = await fetch('/api/plantas');
            lista = await res.json();
            dibujarFiltros();
            dibujar(lista);
        } catch (e) {
            document.getElementById('grid').innerHTML = '<p class="empty">Error al cargar plantas.</p>';
        }
    }

    function dibujarFiltros() {
        const categorias = [...new Set(lista.map(p => String(p.categoria || '').trim()).filter(Boolean))];
        const selector = document.getElementById('filtroCategoria');
        selector.innerHTML = ['Todas', ...categorias].map(categoria => `
            <option value="${escaparHtml(categoria)}"${categoria === categoriaActiva ? ' selected' : ''}>
                ${categoria === 'Todas' ? 'Todas las categorías' : escaparHtml(categoria)}
            </option>
        `).join('');
    }

    function seleccionarCategoria(categoria) {
        categoriaActiva = categoria;
        filtrar();
    }

    function dibujar(datos) {
        const grid = document.getElementById('grid');

        if (datos.length === 0) {
            grid.innerHTML = '<p class="empty">No hay plantas que coincidan con la búsqueda.</p>';
            return;
        }

        grid.innerHTML = datos.map(p => {
            const precio = Number(p.precio).toLocaleString('es-CL');
            const enStock = Number(p.stock) > 0;
            const msg = encodeURIComponent(`Hola, me interesa la planta ${p.nombre}.`);
            return `
                <div class="card" role="button" tabindex="0" onclick="abrirDetallePlantaPorId('${p.id}')"
                    onkeydown="if(event.key === 'Enter' || event.key === ' ') abrirDetallePlantaPorId('${p.id}')">
                    <div class="card-image-wrap"><img src="${escaparHtml(p.foto || '/logo.png')}" onerror="this.src='/logo.png'" alt="${escaparHtml(p.nombre)}" onclick="abrirDetallePlantaPorId('${p.id}'); event.stopPropagation()"></div>
                    <div class="card-body">
                        <span class="stock-badge ${enStock ? 'in-stock' : 'out-of-stock'}">${enStock ? '● En Stock' : '● Agotado'}</span>
                        ${p.categoria ? `<span class="tag">${escaparHtml(p.categoria)}</span>` : ''}
                        <div class="title" onclick="abrirDetallePlantaPorId('${p.id}'); event.stopPropagation()">${escaparHtml(p.nombre)}</div>
                        <div class="sub">${escaparHtml(p.cientifico || '')}</div>
                        <div class="price">$${precio}</div>
                        <a href="https://wa.me/56953450809?text=${msg}" target="_blank" rel="noopener" class="btn-wsp" onclick="event.stopPropagation()">💬 Consultar por WhatsApp</a>
                    </div>
                </div>
            `;
        }).join('');
    }

    function filtrar() {
        const q = document.getElementById('buscar').value.toLowerCase().trim();
        const res = lista.filter(p => 
            (categoriaActiva === 'Todas' || String(p.categoria || '').toLowerCase() === categoriaActiva.toLowerCase()) &&
            (String(p.nombre || '').toLowerCase().includes(q) ||
            String(p.categoria || '').toLowerCase().includes(q))
        );
        dibujar(res);
    }

    function abrirDetallePlanta(planta) {
        if (!planta) return;
        document.getElementById('modalNombre').textContent = planta.nombre || 'Planta';
        document.getElementById('modalCientifico').textContent = planta.cientifico || 'Nombre científico no registrado';
        document.getElementById('modalRiego').textContent = planta.riego || 'Consultar según humedad del sustrato.';
        document.getElementById('modalClima').textContent = planta.clima || 'Consultar condiciones recomendadas.';
        document.getElementById('modalCuidados').textContent = planta.cuidados || 'No hay consejos registrados para esta planta.';
        document.getElementById('modalPlanta').classList.add('visible');
        document.body.style.overflow = 'hidden';
    }

    function abrirDetallePlantaPorId(id) {
        const planta = lista.find(p => String(p.id) === String(id));
        abrirDetallePlanta(planta);
    }

    function cerrarModal(event) {
        if (event && event.target !== document.getElementById('modalPlanta')) return;
        document.getElementById('modalPlanta').classList.remove('visible');
        document.body.style.overflow = '';
    }

    document.addEventListener('keydown', event => {
        if (event.key === 'Escape') cerrarModal();
    });

    cargar();
</script>

</body>
</html>
